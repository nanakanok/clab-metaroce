frr defaults datacenter
hostname p2-leaf2
log syslog informational
!
interface eth1
 ipv6 nd ra-interval 3
 no ipv6 nd suppress-ra
!
interface eth2
 ipv6 nd ra-interval 3
 no ipv6 nd suppress-ra
!
interface eth3
 ipv6 nd ra-interval 3
 no ipv6 nd suppress-ra
!
interface eth4
 ipv6 nd ra-interval 3
 no ipv6 nd suppress-ra
!
interface eth5
 ipv6 address fd00:2:2:1::1/64
!
interface eth6
 ipv6 address fd00:2:2:2::1/64
!
router bgp 65202
 bgp router-id 10.2.1.2
 bgp bestpath as-path multipath-relax
 no bgp ebgp-requires-policy
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as external
 neighbor FABRIC timers 1 3
 neighbor eth1 interface peer-group FABRIC
 neighbor eth2 interface peer-group FABRIC
 neighbor eth3 interface peer-group FABRIC
 neighbor eth4 interface peer-group FABRIC
 !
 address-family ipv6 unicast
  neighbor FABRIC activate
  maximum-paths 64
  network fd00:2:2:1::/64
  network fd00:2:2:2::/64
 exit-address-family
!
